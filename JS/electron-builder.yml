appId: com.firefairyzz.worldeditor
productName: World Editor
directories:
  output: ../WE-Release

files:
  - "**/*"
  - "!node_modules/.bin"
  - "!**/*.map"
  # 排除开发者本地用户数据（隐私），仅保留 lang/ 语言文件
  - "!User/account.json"
  - "!User/settings.json"
  - "!User/avatars"
  - "!User/recent.json"
  - "!User/test"
  - "!resources/recent.json"


win:
  target: 
    - target: nsis
      arch: 
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true