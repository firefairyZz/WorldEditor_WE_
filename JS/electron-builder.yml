appId: com.firefairyzz.worldeditor
productName: World Editor
directories:
  output: ../WE-Release

files:
  - "**/*"
  - "!node_modules/.bin"
  - "!**/*.map"


win:
  target: 
    - target: nsis
      arch: 
        - x64
  icon: resources/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true